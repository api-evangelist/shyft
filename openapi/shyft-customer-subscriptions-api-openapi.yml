  /api/customer/user_role/subscriptions/22449:
    put:
      tags:
      - Customer > Subscriptions
      summary: update subscription
      description: "Description\n- - - \n- API to update specific user's subscritpion \n- Subscripton owner can update it. \n- Channel admin can update it. \n\n\nParams\n- - -\nParam | Values | R |Description\n--- | --- | --- | ---\n\n\nHeaders\n- - -\nHeader | Values | R |Description\n--- | --- | --- | ---\n\n\n\nInput\n- - - \n\nAttribute | Values | R |Description\n--- | --- | --- | ---\nsubscription_last_synchronize | {timestamp} | | Posts prior to this time point will be considered as read already by client side.\npost_id_last_synchronize | post_id | | Posts prior to this post will be considered as read already by client side."
      requestBody:
        content:
          '*/*':
            schema:
              type: string
              example: '"{\n  \"subscription\": {\n    \"post_id_last_synchronize\": 100\n  }\n}\t"'
      parameters:
      - name: Session-Uukey
        in: header
        schema:
          type: string
        example: '{{session_uukey}}'
      - name: Content-Type
        in: header
        schema:
          type: string
        example: application/json
      responses:
        '204':
          description: No Content
          headers:
            X-Frame-Options:
              schema:
                type: string
                example: SAMEORIGIN
            X-XSS-Protection:
              schema:
                type: string
                example: 1; mode=block
            X-Content-Type-Options:
              schema:
                type: string
                example: nosniff
            X-LS-License:
              schema:
                type: string
                example: All Rights Reserved Â© Coffee Enterprise
            X-LS-Application:
              schema:
                type: string
                example: Coffee Mobile
            X-Request-Method:
              schema:
                type: string
                example: none
            Cache-Control:
              schema:
                type: string
                example: no-cache
            Set-Cookie:
              schema:
                type: string
                example: _shyft_api_server_session=aEZCYmVicVVaRTRFS01INmhhMUVyRGZ0ZUl0dytTQmxFcUxIenNoVUloZi9PTUp1b2dvOElaN29HbVhFT1V6c3ltUGtpOE92b0s4R2pqbXNyRU12cHc9PS0taUJUVmhocjNJYXQzN2xvY3dBdFViZz09--c0dfb9f3a47c10d17e6cc81c01fbf2d0a031054d; path=/; HttpOnly
            X-Rack-Dev-Mark-Env:
              schema:
                type: string
                example: BinLocalServer
            X-Request-Id:
              schema:
                type: string
                example: fe25489b-31ae-4ae6-bfbb-5f2a1f8acd84
            X-Runtime:
              schema:
                type: number
                example: '14.456580'
            Vary:
              schema:
                type: string
                example: Origin
            Connection:
              schema:
                type: string
                example: close
            Server:
              schema:
                type: string
                example: thin
          content:
            text/plain:
              schema:
                type: string
              examples:
                example-0:
                  summary: update the last sync time to reset the unread posts number on server side.
                  value: ''
                example-1:
                  summary: update subscription - mute subscription
                  value: null
