paths:
  /api/customer/user_role/subscriptions:
    get:
      tags:
      - Customer > Subscriptions
      summary: get my subscriptions
      description: Get all my subscriptions
      parameters:
      - name: Session-Uukey
        in: header
        schema:
          type: string
        example: '{{session_uukey}}'
      - name: Content-Type
        in: header
        schema:
          type: string
        example: application/json
      - name: location_id_is
        in: query
        schema:
          type: string
        description: filter my subscriptions by location
        example: '{{location_id}}'
      - name: channel_id
        in: query
        schema:
          type: string
        description: 'filter my subscriptions by channel

          '
        example: '{{channel_id}}'
      - name: channel_type_is[]
        in: query
        schema:
          type: string
        example: custom_feed
      - name: updated_after
        in: query
        schema:
          type: string
        example: '2020-01-01'
      responses:
        '200':
          description: OK
          headers:
            X-Frame-Options:
              schema:
                type: string
                example: SAMEORIGIN
            X-XSS-Protection:
              schema:
