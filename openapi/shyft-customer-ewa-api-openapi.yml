                example: '20.730608'
            Vary:
              schema:
                type: string
                example: Origin
            Transfer-Encoding:
              schema:
                type: string
                example: chunked
          content:
            application/json:
              schema:
                type: object
              example:
                ewa_account:
                  _parent_object_id: null
                  id: 1
                  tos_yes: true
                  is_active: true
                  ewa_score: null
                  ewa_balance_cents: -400
