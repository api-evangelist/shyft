    id | | |

    tos_yes | | | Indciate if user has accepted the TOS by going through all pages.'
paths:
  /api/customer/user_role/ewa/ewa_accounts/my_account:
    get:
      tags:
      - Customer > EWA
      summary: '[ewa_account] get or create my EWA account'
      description: 'Description

        - - -

        - This is the first API call when user choose to use EWA by clicking the function button.

        - It will find the current user''s existing EWA account and return its profile.

        - It will create a new basic EWA account for current user if not found one, and return its profile


        If got `tos_yes=false`, front-end want to present these TOS pages again.

        If got no `active_bank_account`, front-end want to present the bacnk account linking page


        Params

        - - -

        Param | Values | R |Description

        --- | --- | --- | ---


        Headers

        - - -

        Header | Values | R |Description

        --- | --- | --- | ---


        Input

        - - -


        Attribute | Values | R |Description

        --- | --- | --- | ---


        Output

        - - -


        [EWA Account Serializer]'
      parameters:
      - name: Session-Uukey
        in: header
        schema:
          type: string
        example: '{{session_uukey}}'
      - name: Content-Type
        in: header
        schema:
          type: string
        example: application/json
      responses:
        '200':
          description: OK
          headers:
            X-Frame-Options:
              schema:
                type: string
                example: SAMEORIGIN
            X-XSS-Protection:
              schema:
                type: string
                example: 1; mode=block
            X-Content-Type-Options:
              schema:
                type: string
                example: nosniff
            X-Download-Options:
              schema:
                type: string
                example: noopen
            X-Permitted-Cross-Domain-Policies:
              schema:
                type: string
                example: none
            Referrer-Policy:
              schema:
                type: string
                example: strict-origin-when-cross-origin
            X-LS-License:
              schema:
                type: string
                example: All Rights Reserved Â© Coffee Enterprise
            X-LS-Application:
              schema:
                type: string
                example: Coffee Mobile
            X-Request-Method:
              schema:
                type: string
                example: none
            Content-Type:
              schema:
                type: string
                example: application/json; charset=utf-8
