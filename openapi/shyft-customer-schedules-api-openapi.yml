        example: '{{session_uukey}}'
      - name: Content-Type
        in: header
        schema:
          type: string
        description: '[MESSION] session token ID. deprecate it soon.'
        example: application/json
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
    noauthAuth:
      type: http
      scheme: noauth
