            X-Runtime:
              schema:
                type: number
                example: '3.560532'
            Vary:
              schema:
                type: string
                example: Origin
          content:
            application/json:
              schema:
                type: object
              examples:
                example-0:
                  summary: get mine department memberships
                  value:
                    department_memberships:
                    - _parent_object_id: null
                      id: 10
                      department_id: 1
                      user_privilege_id: 21574
                      user_id: 14815
                      is_main: false
                    meta:
                      pagination:
                        current_page: 1
                        per_page: 25
                example-1:
                  summary: get mine department memberships - with location filter
                  value:
                    department_memberships:
                    - _parent_object_id: null
                      id: 10
                      department_id: 1
                      location_id: 2806
                      user_privilege_id: 21574
                      user_id: 14815
                      is_main: false
                    meta:
                      pagination:
