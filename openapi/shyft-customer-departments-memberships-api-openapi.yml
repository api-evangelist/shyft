                example: _shyft_api_server_session=SENSWVVhcmFXbnFpUm1FYVlkUDZQMm5pSDhhWHowRXlYWkxJN1VpcWNwaWtBdkZSbVVMNmJXQU1DU3Z6UG1uOTc2bVZhWGFrSWxlWnE1bnVHeE10anc9PS0tdWFLNEw2UE51T3UyVEhlYXQ4TVZUdz09--72fadd74a3019184cfbb4820b8b25e503f24be12; path=/; HttpOnly
            X-Rack-Dev-Mark-Env:
