openapi: 3.2.0
info:
  title: Shyft Customer Customer > Invitations API
  description: Welcome to the Shyft Customer App API.
  version: 1.0.0
servers:
- url: http://{{host}}
- url: http://{{local-host}}
- url: http://{{sp3-host}}
- url: http://test-service.myshyft.com
- url: http://localhost:4001
- url: http://localhost:3000
- url: http://{{local-host}}api
- url: https://test-unfurl.myshyft.com
tags:
- name: Customer > Invitations
paths:
  /api/customer/user_role/locations/{location_id}/invitations/invite:
    post:
      tags:
      - Customer > Invitations
      summary: Invite contacts
      requestBody:
        content:
          '*/*':
            schema:
              type: string
              example: '"{\n\t\"invitees\": [\n\t\t{\n\t\t\t\"full_name\": \"John Doe\",\n\t\t\t\"phone_number\": \"18083836511\"\n\t\t},\n\t\t{\n\t\t\t\"full_name\": \"John Doe\",\n\t\t\t\"phone_number\": \"18083836511\"\t\n\t\t},\n\t\t{\n\t\t\t\"full_name\": \"John Doe\",\n\t\t\t\"phone_number\": \"18083836511\"\t\n\t\t},\n\t\t{\n\t\t\t\"full_name\": \"John Doe\",\n\t\t\t\"phone_number\": \"18083836511\"\t\n\t\t}\n\t]\n}"'
      parameters:
      - name: Session-Uukey
        in: header
        schema:
          type: string
        example: '{{session_uukey}}'
      - name: Content-Type
        in: header
        schema:
          type: string
        description: '[MESSION] session token ID. deprecate it soon.'
        example: application/json
      - name: location_id
        in: path
        schema:
          type: string
        required: true
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
      operationId: postApiCustomerUserRoleLocationsByLocationIdInvitationsInvite
      x-operation-id-source: derived
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
    noauthAuth:
      type: http
      scheme: noauth
