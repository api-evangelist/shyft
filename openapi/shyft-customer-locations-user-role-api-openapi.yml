      tags:
      - Customer > Locations > user_role
      summary: create a location (option to join)
      description: "Description\n- - - \n- Create a location object\n- `location_name` is always required. \n- Option1: supply address information, let backend figure out rest\n- Option2: supply the formatted address, and other required fields. \n\nParams\n- - -\nParam | Values | R |Description\n--- | --- | --- | ---\n\n\nHeaders\n- - -\nHeader | Values | R |Description\n--- | --- | --- | ---\n\n\n\nInput\n- - -\n\nOption 1\n\nAttribute | Values | R |Description\n--- | --- | --- | ---\nlocation_name ||*| |\naddress | | * | |\ncity | | * | |\nprovince | | * | |\npostal | | * | |\ncountry | | * | |\n\n\nOption 2\n\nAttribute | Values | R |Description\n--- | --- | --- | ---\nlocation_name | | * | |\nformatted_address | | * | |\nlatitude | | * | |\nlongitude | | * | |\ngoogle_map_id | | * | |\n\nWith join location\n\nAttribute | Values | R |Description\n--- | --- | --- | ---\nlocation_name[user_privileges_attributes][owner_id] ||| |\nlocation_name[user_privileges_attributes][internal_id] ||| |\nlocation_name[user_privileges_attributes][position] ||| |"
      requestBody:
        content:
          '*/*':
            schema:
              type: string
              example: '"{\n  \"location\": {\n  \t\"location_name\": \"Shyft Tech.\",\n  \t\"latitude\": \"90.0\",\n  \t\"longitude\": \"180.0\",\n  \t\"google_map_id\": \"xxxxxxx\",\n  \t\"time_zone\": \"America/Los_Angeles\",\n  \t\"formatted_address\": \"3131 Western Ave #515, Seattle, WA 98121\", \n  \t\"user_privileges_attributes\": [\n  \t\t{\n  \t\t\t\"owner_id\": 2, \n  \t\t\t\"internal_id\": \"0000000\",\n  \t\t\t\"position\": \"engineer\"\n  \t\t}\n  \t\t\n  \t]\n  }\n}"'
      parameters:
      - name: Session-Uukey
        in: header
        schema:
          type: string
        example: '{{session_uukey}}'
      - name: Content-Type
        in: header
        schema:
          type: string
        example: application/json
