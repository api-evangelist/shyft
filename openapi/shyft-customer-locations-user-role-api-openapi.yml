  /api/customer/user_role/locations/find_or_create:
    post:
      tags:
      - Customer > Locations > user_role
      summary: find or create a location (option to join)
      description: "Description\n- - - \n- Create a location object\n- `location_name` is always required. \n- Option1: supply address information, let backend figure out rest\n- Option2: supply the formatted address, and other required fields. \n\nParams\n- - -\nParam | Values | R |Description\n--- | --- | --- | ---\njoin | false/true | | | join the location created \n\nHeaders\n- - -\nHeader | Values | R |Description\n--- | --- | --- | ---\n\n\n\nInput\n- - -\n\nOption 1\n\nAttribute | Values | R |Description\n--- | --- | --- | ---\nlocation_name ||*| |\naddress | | * | |\ncity | | * | |\nprovince | | * | |\npostal | | * | |\ncountry | | * | |\n\n\nOption 2\n\nAttribute | Values | R |Description\n--- | --- | --- | ---\nlocation_name | | * | |\nformatted_address | | * | |\nlatitude | | * | |\nlongitude | | * | |\ngoogle_map_id | | * | |"
      requestBody:
        content:
          '*/*':
            schema:
              type: string
              example: '"{\n  \"location\": {\n  \t\"location_name\": \"Shyft Tech.\",\n  \t\"latitude\": \"90.0\",\n  \t\"longitude\": \"180.0\",\n  \t\"google_map_id\": \"xxxxxxx\",\n  \t\"time_zone\": \"America/Los_Angeles\",\n  \t\"formatted_address\": \"3131 Western Ave #515, Seattle, WA 98121\"\n  }\n}"'
      parameters:
      - name: Session-Uukey
        in: header
        schema:
          type: string
        example: '{{session_uukey}}'
      - name: Content-Type
        in: header
        schema:
          type: string
        example: application/json
      - name: join
        in: query
