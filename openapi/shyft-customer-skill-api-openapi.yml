openapi: 3.2.0
info:
  title: Shyft Customer Customer > Skill API
  description: Welcome to the Shyft Customer App API.
  version: 1.0.0
servers:
- url: http://{{host}}
- url: http://{{local-host}}
- url: http://{{sp3-host}}
- url: http://test-service.myshyft.com
- url: http://localhost:4001
- url: http://localhost:3000
- url: http://{{local-host}}api
- url: https://test-unfurl.myshyft.com
tags:
- name: Customer > Skill
paths:
  /api/customer/user_role/locations/2806/skills/managable:
    get:
      tags:
      - Customer > Skill
      summary: load location's managable skills
      parameters:
      - name: Session-Uukey
        in: header
        schema:
          type: string
        example: '{{session_uukey}}'
      - name: Content-Type
        in: header
        schema:
          type: string
        example: application/json
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
      operationId: getApiCustomerUserRoleLocations2806SkillsManagable
      x-operation-id-source: derived
  /api/customer/user_role/locations/2806/skills/{skill_id}:
    get:
      tags:
      - Customer > Skill
      summary: load a single mangable skill
      parameters:
      - name: skill_id
        in: path
        schema:
          type: string
        required: true
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
      operationId: getApiCustomerUserRoleLocations2806SkillsBySkillId
      x-operation-id-source: derived
    put:
      tags:
      - Customer > Skill
      summary: update a skill
      requestBody:
        content:
          '*/*':
            schema:
              type: string
              example: '"{\n    \"skill\": {\n        \"name\": \"New Skill\"\n    }\n}"'
      parameters:
      - name: Session-Uukey
        in: header
        schema:
          type: string
        example: '{{session_uukey}}'
      - name: Content-Type
        in: header
        schema:
          type: string
        example: application/json
      - name: skill_id
        in: path
        schema:
          type: string
        required: true
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
      operationId: putApiCustomerUserRoleLocations2806SkillsBySkillId
      x-operation-id-source: derived
    delete:
      tags:
      - Customer > Skill
      summary: delete a skill
      parameters:
      - name: Session-Uukey
        in: header
        schema:
          type: string
        example: '{{session_uukey}}'
      - name: Content-Type
        in: header
        schema:
          type: string
        example: application/json
      - name: skill_id
        in: path
        schema:
          type: string
        required: true
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
      operationId: deleteApiCustomerUserRoleLocations2806SkillsBySkillId
      x-operation-id-source: derived
  /api/customer/user_role/locations/2806/skills:
    post:
      tags:
      - Customer > Skill
      summary: create a new skill
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                skill:
                  name: Sample Skill
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
      operationId: postApiCustomerUserRoleLocations2806Skills
      x-operation-id-source: derived
  /api/customer/user_role/locations/2806/assign_user_skills/7613:
