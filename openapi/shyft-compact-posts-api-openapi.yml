openapi: 3.2.0
info:
  title: Shyft Customer Compact > Posts API
  description: Welcome to the Shyft Customer App API.
  version: 1.0.0
servers:
- url: http://{{host}}
- url: http://{{local-host}}
- url: http://{{sp3-host}}
- url: http://test-service.myshyft.com
- url: http://localhost:4001
- url: http://localhost:3000
- url: http://{{local-host}}api
- url: https://test-unfurl.myshyft.com
tags:
- name: Compact > Posts
  description: 'What is Free Post?


    Free Post is basically a type of `post`, with `post_type = 22`


    * free post requires `postable_type` and `postable_id`

    * current user must has visibility of `postable` to create a free_post for it.

    * free post does not take a `channel_id` as input

    * any API targeting on a single post can be used for `free_post`


    Please use the regular post `create` API to create a free_post


    * Here we are applying `compact` serializer to the result.'
paths:
  /api/compact/posts/{post_id}/free_posts:
