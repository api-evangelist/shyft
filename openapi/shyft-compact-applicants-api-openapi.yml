openapi: 3.2.0
info:
  title: Shyft Customer Compact > Applicants API
  description: Welcome to the Shyft Customer App API.
  version: 1.0.0
servers:
- url: http://{{host}}
- url: http://{{local-host}}
- url: http://{{sp3-host}}
- url: http://test-service.myshyft.com
- url: http://localhost:4001
- url: http://localhost:3000
- url: http://{{local-host}}api
- url: https://test-unfurl.myshyft.com
tags:
- name: Compact > Applicants
paths:
  /api/compact/posts/110116/applicants:
    get:
      tags:
      - Compact > Applicants
      summary: get a post's applicants
      description: 'NOTE: Only applicable for `shift post` , otherwise raise `403`'
      parameters:
      - name: Session-Uukey
        in: header
        schema:
          type: string
        example: '{{session_uukey}}'
      - name: Content-Type
        in: header
        schema:
          type: string
        example: application/json
      - name: user_id
        in: query
        schema:
          type: integer
        description: filter the result by user
        example: '14423'
      responses:
        '200':
          description: OK
          headers:
            Server:
              schema:
                type: string
                example: nginx/1.19.3
            Date:
              schema:
                type: string
                example: Tue, 04 May 2021 00:17:01 GMT
            Content-Type:
              schema:
                type: string
                example: application/json; charset=utf-8
            Transfer-Encoding:
              schema:
                type: string
                example: chunked
            Connection:
              schema:
                type: string
                example: keep-alive
            X-Frame-Options:
              schema:
                type: string
                example: SAMEORIGIN
            X-XSS-Protection:
              schema:
                type: string
                example: 1; mode=block
            X-Content-Type-Options:
              schema:
                type: string
                example: nosniff
            X-Download-Options:
              schema:
                type: string
                example: noopen
            X-Permitted-Cross-Domain-Policies:
              schema:
                type: string
                example: none
            Referrer-Policy:
              schema:
                type: string
                example: strict-origin-when-cross-origin
            X-LS-License:
              schema:
                type: string
                example: All Rights Reserved Â© Coffee Enterprise
            X-LS-Application:
              schema:
                type: string
                example: Coffee Mobile
            X-Request-Method:
              schema:
                type: string
                example: none
            ETag:
              schema:
                type: string
                example: W/"ff147b90e63d10cf0bd39bcce3744579"
            Cache-Control:
              schema:
                type: string
                example: max-age=0, private, must-revalidate
            Set-Cookie:
              schema:
                type: string
                example: _shyft_api_server_session=S3liNDVmWFVadFFRUEtERVBwS050WHBjUDB6Q1RLZC8rRGNJREJxemZqNFczS016bXNkMzZwbmRTcitmQUpwUkppYm93d3FOdWtwUTJNNDFxTFBGdVE9PS0tU0FXWW5GV0lBczNLOHQza3Y0aC9IZz09--ccde606b74b3dd2eb2dd2a38f1fce3ad9262bd0a; path=/; HttpOnly
            X-Rack-Dev-Mark-Env:
              schema:
                type: string
                example: BinLocalServer
            X-Request-Id:
              schema:
                type: string
                example: 2386c961-5b5d-4f80-bd10-3ed60cb6e469
            X-Runtime:
              schema:
                type: number
                example: '0.380755'
            Vary:
              schema:
                type: string
                example: Origin
          content:
            application/json:
              schema:
                type: object
              example:
                applicants:
                - _parent_object_id: null
                  id: 5235
                  status: picked
                  user_id: 14423
                  schedule_element_id: 2624203
                meta:
                  pagination:
                    current_page: 1
                    per_page: 500
      operationId: getApiCompactPosts110116Applicants
      x-operation-id-source: derived
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
    noauthAuth:
      type: http
      scheme: noauth
