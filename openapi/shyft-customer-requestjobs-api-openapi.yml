- name: Customer > RequestJobs
paths:
  /api/customer/request_jobs:
    get:
      tags:
      - Customer > RequestJobs
      summary: Get request jobs
      security:
      - bearerAuth: []
      parameters:
      - name: Session-Uukey
        in: header
        schema:
          type: string
        example: 86c78555-b722-42e0-a722-7ba2789a109c
      - name: Content-Type
        in: header
        schema:
          type: string
        example: application/json
      - name: Authorization
        in: header
        schema:
          type: string
        description: '[MESSION] api key, preset inside app, not secure

          '
        example: Token token={{api_key_access_token}}
      - name: uuid_is
        in: query
        schema:
          type: string
        example: ccc12dbc-181b-4c52-ab11-080f4b8a3d1c,f95e8398-f902-46c4-bd4b-bd73ddedc0f4
      responses:
        '200':
          description: OK
          headers:
            Cache-Control:
              schema:
                type: string
                example: max-age=0, private, must-revalidate
            Content-Encoding:
              schema:
                type: string
                example: gzip
            Content-Type:
              schema:
                type: string
                example: application/json; charset=utf-8
            Date:
              schema:
                type: string
                example: Fri, 13 Sep 2019 17:29:00 GMT
            ETag:
              schema:
                type: string
                example: W/"52cd9c19bedb5e14f46e5ed41aa935e8"
            Server:
              schema:
                type: string
                example: nginx/1.14.1 + Phusion Passenger 4.0.60
            Set-Cookie:
              schema:
                type: string
                example: _shyft_api_server_session=dXhZeEJ0ZkFvQnQwNWdNSllNY254NkZwYUkxV0E1TmVtbzd6NDB6UTdPRjlqam1LNzNubVRaQXl6SHRNaXUxK1FncnJTMW9QdkFNdFhIWlpHN1dVUHc9PS0tYWl1ZGdEVWxVMWduK1RqUmZ6OFNDdz09--0273f07b93e058ae2fc24453f7f1f76b2b979e1d; path=/; secure; HttpOnly
            Status:
              schema:
                type: string
                example: 200 OK
            Strict-Transport-Security:
              schema:
                type: string
                example: max-age=15552000; includeSubDomains
            Vary:
              schema:
                type: string
                example: Origin
            X-Content-Type-Options:
              schema:
                type: string
                example: nosniff
            X-Frame-Options:
              schema:
                type: string
                example: SAMEORIGIN
            X-LS-Application:
              schema:
                type: string
                example: Coffee Mobile
            X-LS-License:
              schema:
                type: string
                example: All Rights Reserved Â© Coffee Enterprise
            X-Powered-By:
              schema:
                type: string
                example: Phusion Passenger 4.0.60
            X-Rack-Dev-Mark-Env:
              schema:
                type: string
                example: development3
            X-Request-Id:
              schema:
                type: string
                example: 9ab3742f-5dff-4b6a-99b8-e18cb558ac9d
            X-Request-Method:
              schema:
                type: string
                example: none
            X-Runtime:
              schema:
                type: number
                example: '0.148415'
            X-XSS-Protection:
              schema:
                type: string
                example: 1; mode=block
            transfer-encoding:
              schema:
                type: string
                example: chunked
            Connection:
              schema:
                type: string
                example: keep-alive
          content:
            application/json:
              schema:
                type: object
              example:
