tags:
- name: Customer > Comments
paths:
  /api/customer/user_role/comments:
    get:
      tags:
      - Customer > Comments
      summary: get comments
      description: please supply `post_id` for getting commeents for particular post
      parameters:
      - name: Session-Uukey
        in: header
        schema:
          type: string
        example: '{{session_uukey}}'
      - name: Content-Type
        in: header
        schema:
          type: string
        example: application/json
      - name: response[nested]
        in: query
        schema:
          type: integer
        example: '2'
      - name: response[keep]
        in: query
        schema:
          type: string
        example: like_owners
      - name: post_id
        in: query
        schema:
          type: integer
        example: '143548'
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
      operationId: getApiCustomerUserRoleComments
      x-operation-id-source: derived
    post:
      tags:
      - Customer > Comments
      summary: create comment
      requestBody:
        content:
          '*/*':
            schema:
              type: string
              example: '" {\n    \"comment\": {  \n\t    \"source_id\": \"22120\",\n\t    \"content\": \"Here is my comment!\"\n\t}\n}"'
      parameters:
      - name: Session-Uukey
        in: header
        schema:
          type: string
        example: '{{session_uukey}}'
      - name: Content-Type
        in: header
        schema:
          type: string
        example: application/json
      responses:
        '201':
          description: Created
          headers:
            X-Frame-Options:
              schema:
                type: string
                example: SAMEORIGIN
            X-XSS-Protection:
              schema:
                type: string
                example: 1; mode=block
            X-Content-Type-Options:
              schema:
                type: string
                example: nosniff
            X-LS-License:
