  /api/integration/shifts/bulk_upsync:
    post:
      tags:
      - Customer > Shifts
      summary: '[shifts] bulk upsync shifts'
      description: "Description\n- - - \nSynchronize multiple shifts (create, update, delete)\n\n* This API can import existing users' shifts. \n* This API can update existing shifts' changes. \n* This API can remove existing shifts. \n* This API can update existing shift or create it if not created yet. \n\n* With `async_mode=false`, the server will process the data immediately and return the processed data. It should only be used for small amount of data. \n\n* With `async_mode=true`, the server will process the data in background and return a `job` ID. The job processing result can be pulled by calling `Action Job` API.\n\n\nInput\n* System prefer time format having zone attached (better be UTC) like `2018-04-01 09:00:00 UTC`. Otherwise it will be treated as shift location\n's local time in case like `2018-04-01 09:00:00`.\n- - - \nAttribute | Values | R |Description\n--- | --- | --- | ---\n_record_action | create\\|  update\\|  delete\\|  update_or_create| * | For `update_or_create`, it will update existing shift or create it if not found\nshift_reference_id | | * | Shift's global unique ID from partner's system\nemployee_id | | * | Employee assigned to this shift. Not supply it for `open shift`\nstart_at | | * | Shift's start time. \nend_at | | * | Shift's end time. \nsite_reference_id | | * | Shift location's global unique ID from partner's system. \nsegments | Sub Array | | If there are segments\nsegment_reference_id | | | Segment's global unique ID\nstart_at | | | Segment start time. \nstart_at | | | Segment end time. \njob_code | | | Segment job code\ndepartment_code | | | Segment department code"
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      parameters:
      - name: Session-Uukey
        in: header
        schema:
          type: string
        example: '{{session_uukey}}'
      responses:
        '201':
          description: Created
          headers:
            X-Frame-Options:
              schema:
                type: string
                example: SAMEORIGIN
            X-XSS-Protection:
              schema:
                type: string
                example: 1; mode=block
            X-Content-Type-Options:
              schema:
                type: string
                example: nosniff
            X-Download-Options:
              schema:
                type: string
                example: noopen
            X-Permitted-Cross-Domain-Policies:
              schema:
                type: string
                example: none
            Referrer-Policy:
              schema:
                type: string
                example: strict-origin-when-cross-origin
            Content-Type:
              schema:
                type: string
                example: application/json; charset=utf-8
            ETag:
              schema:
                type: string
                example: W/"fd94250fac5fd2ccae83141e08ba8373"
            Cache-Control:
              schema:
                type: string
                example: max-age=0, private, must-revalidate
            Set-Cookie:
