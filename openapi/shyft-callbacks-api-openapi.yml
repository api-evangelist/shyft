openapi: 3.2.0
info:
  title: Shyft Customer Callbacks API
  description: Welcome to the Shyft Customer App API.
  version: 1.0.0
servers:
- url: http://{{host}}
- url: http://{{local-host}}
- url: http://{{sp3-host}}
- url: http://test-service.myshyft.com
- url: http://localhost:4001
- url: http://localhost:3000
- url: http://{{local-host}}api
- url: https://test-unfurl.myshyft.com
tags:
- name: Callbacks
paths:
  /stripe_new_subscription:
    post:
      tags:
      - Callbacks
      summary: Stripe callback
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                id: evt_1NiqDNAU4buAi3LkEgKxCoDU
                object: event
                api_version: '2017-08-15'
                created: 1692932257
                data:
                  object:
                    id: cs_test_a1Wuy7TjEeG8uhR5wDItNeS825rzS8QTnWBSDBRgVzLozShEZJzUg7oOgd
                    object: checkout.session
                    after_expiration: null
                    allow_promotion_codes: false
                    amount_subtotal: 1900
                    amount_total: 1900
                    automatic_tax:
                      enabled: true
                      status: complete
                    billing_address_collection: auto
                    cancel_url: https://stripe.com
                    client_reference_id: null
                    consent:
                      promotions: null
                      terms_of_service: accepted
                    consent_collection:
                      promotions: none
                      terms_of_service: required
                    created: 1692932114
                    currency: usd
                    currency_conversion: null
                    custom_fields:
                    - dropdown: null
                      key: businessname
                      label:
                        custom: Business Name
                        type: custom
                      numeric: null
                      optional: false
                      text:
                        maximum_length: null
                        minimum_length: null
                        value: Stripe Test Location
                      type: text
                    - dropdown: null
                      key: businessaddress
                      label:
                        custom: Business Address
                        type: custom
                      numeric: null
                      optional: false
                      text:
                        maximum_length: null
                        minimum_length: null
                        value: 1212 Nuuanu Avenue, Honolulu, HI 96817
                      type: text
                    custom_text:
                      shipping_address: null
                      submit: null
                    customer: cus_OVrxCg35MDSzft
                    customer_creation: if_required
                    customer_details:
                      address:
                        city: Bothell
                        country: US
                        line1: 123th PL NE
                        line2: null
                        postal_code: '98011'
                        state: WA
                      email: bin+stripe@myshyft.com
                      name: Bin Li
                      phone: '+18887653568'
                      tax_exempt: none
                      tax_ids: []
                    customer_email: null
                    expires_at: 1693018513
                    invoice: in_1NiqDIAU4buAi3Lkpgt3wMwL
                    invoice_creation: null
                    livemode: false
                    locale: auto
                    metadata:
                      client_reference_id: full_service
                    mode: subscription
                    payment_intent: null
                    payment_link: plink_1Nct2hAU4buAi3LkFKupKfvk
                    payment_method_collection: always
                    payment_method_options: null
                    payment_method_types:
                    - card
                    - link
                    - cashapp
                    payment_status: paid
                    phone_number_collection:
                      enabled: true
                    recovered_from: null
                    setup_intent: null
                    shipping: null
                    shipping_address_collection: null
                    shipping_options: []
                    shipping_rate: null
                    status: complete
                    submit_type: auto
                    subscription: sub_1NiqDIAU4buAi3LkJIrTT7Q2
                    success_url: https://stripe.com
                    total_details:
                      amount_discount: 0
                      amount_shipping: 0
                      amount_tax: 0
                    url: null
                livemode: false
                pending_webhooks: 1
                request:
                  id: null
                  idempotency_key: null
                type: checkout.session.completed
      parameters:
      - name: Content-Type
        in: header
        schema:
          type: string
        example: application/json
      - name: Stripe-Signature
        in: header
        schema:
          type: string
        example: t=1692922649,v1=df59c0d4ec83168eab44fd32a7d7c94383f513347773e67772c6ac20a0d61c86,v0=33c90eb139b42cf174fceef6e03585222b2da7e13a260bcf2b373583d52a012b
      responses:
        '200':
          description: OK
          headers:
            X-Frame-Options:
              schema:
                type: string
                example: SAMEORIGIN
            X-XSS-Protection:
              schema:
                type: string
                example: 1; mode=block
            X-Content-Type-Options:
              schema:
                type: string
                example: nosniff
            X-Download-Options:
              schema:
                type: string
                example: noopen
            X-Permitted-Cross-Domain-Policies:
              schema:
                type: string
                example: none
            Referrer-Policy:
              schema:
                type: string
                example: strict-origin-when-cross-origin
            Content-Type:
              schema:
                type: string
                example: text/html
            Cache-Control:
              schema:
                type: string
                example: no-cache
            X-Rack-Dev-Mark-Env:
              schema:
                type: string
                example: BinLocalServer
            X-Request-Id:
              schema:
                type: string
                example: c6f9521f-0f9d-495a-91bb-81a0ca0f98ba
            X-Runtime:
              schema:
                type: number
                example: '30.481751'
            Vary:
              schema:
                type: string
                example: Origin
            Transfer-Encoding:
              schema:
                type: string
                example: chunked
          content:
            text/plain:
              schema:
                type: string
              examples:
                example-0:
                  summary: WIth existing location
                  value: null
                example-1:
                  summary: sign up from Stripe
                  value: null
      operationId: postStripeNewSubscription
      x-operation-id-source: derived
  /gap_oauth:
    post:
      tags:
      - Callbacks
      summary: '{{host}}/gap_oauth Copy'
      requestBody:
        content:
          '*/*':
            schema:
              type: string
              example: '"{\n\t\"test\": \"body\"\n}"'
      parameters:
      - name: Content-Type
        in: header
        schema:
          type: string
        example: application/json
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
      operationId: postGapOauth
      x-operation-id-source: derived
  /lb_sso:
    post:
      tags:
      - Callbacks
      summary: '{{host}}/lb_sso'
      requestBody:
        content:
          '*/*':
            schema:
              type: string
              example: '"{\n\t\"test\": \"body\"\n}"'
      parameters:
      - name: Content-Type
        in: header
        schema:
          type: string
        example: application/json
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
      operationId: postLbSso
      x-operation-id-source: derived
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
    noauthAuth:
      type: http
      scheme: noauth
