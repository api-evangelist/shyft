                      optional: false
                      text:
                        maximum_length: null
                        minimum_length: null
                        value: 1212 Nuuanu Avenue, Honolulu, HI 96817
                      type: text
                    custom_text:
                      shipping_address: null
                      submit: null
                    customer: cus_OVrxCg35MDSzft
                    customer_creation: if_required
                    customer_details:
                      address:
                        city: Bothell
                        country: US
                        line1: 123th PL NE
                        line2: null
                        postal_code: '98011'
                        state: WA
                      email: bin+stripe@myshyft.com
                      name: Bin Li
                      phone: '+18887653568'
                      tax_exempt: none
                      tax_ids: []
                    customer_email: null
                    expires_at: 1693018513
                    invoice: in_1NiqDIAU4buAi3Lkpgt3wMwL
                    invoice_creation: null
                    livemode: false
                    locale: auto
                    metadata:
                      client_reference_id: full_service
                    mode: subscription
                    payment_intent: null
                    payment_link: plink_1Nct2hAU4buAi3LkFKupKfvk
                    payment_method_collection: always
                    payment_method_options: null
                    payment_method_types:
                    - card
