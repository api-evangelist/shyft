                    success_url: https://stripe.com
                    total_details:
                      amount_discount: 0
                      amount_shipping: 0
                      amount_tax: 0
                    url: null
                livemode: false
                pending_webhooks: 1
                request:
                  id: null
                  idempotency_key: null
                type: checkout.session.completed
      parameters:
      - name: Content-Type
        in: header
        schema:
          type: string
        example: application/json
      - name: Stripe-Signature
        in: header
        schema:
          type: string
        example: t=1692922649,v1=df59c0d4ec83168eab44fd32a7d7c94383f513347773e67772c6ac20a0d61c86,v0=33c90eb139b42cf174fceef6e03585222b2da7e13a260bcf2b373583d52a012b
      responses:
        '200':
          description: OK
          headers:
            X-Frame-Options:
              schema:
                type: string
                example: SAMEORIGIN
            X-XSS-Protection:
              schema:
                type: string
                example: 1; mode=block
            X-Content-Type-Options:
              schema:
                type: string
                example: nosniff
            X-Download-Options:
              schema:
                type: string
                example: noopen
            X-Permitted-Cross-Domain-Policies:
              schema:
                type: string
                example: none
            Referrer-Policy:
              schema:
                type: string
                example: strict-origin-when-cross-origin
            Content-Type:
              schema:
                type: string
                example: text/html
            Cache-Control:
              schema:
                type: string
                example: no-cache
            X-Rack-Dev-Mark-Env:
              schema:
                type: string
                example: BinLocalServer
            X-Request-Id:
              schema:
                type: string
                example: c6f9521f-0f9d-495a-91bb-81a0ca0f98ba
            X-Runtime:
              schema:
                type: number
                example: '30.481751'
            Vary:
              schema:
                type: string
                example: Origin
            Transfer-Encoding:
              schema:
                type: string
                example: chunked
          content:
            text/plain:
              schema:
                type: string
              examples:
                example-0:
                  summary: WIth existing location
                  value: null
                example-1:
                  summary: sign up from Stripe
                  value: null
  /gap_oauth:
    post:
      tags:
      - Callbacks
      summary: '{{host}}/gap_oauth Copy'
      requestBody:
        content:
          '*/*':
            schema:
              type: string
              example: '"{\n\t\"test\": \"body\"\n}"'
      parameters:
      - name: Content-Type
        in: header
        schema:
          type: string
        example: application/json
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
  /lb_sso:
    post:
      tags:
      - Callbacks
      summary: '{{host}}/lb_sso'
      requestBody:
        content:
          '*/*':
            schema:
              type: string
              example: '"{\n\t\"test\": \"body\"\n}"'
      parameters:
      - name: Content-Type
        in: header
        schema:
          type: string
        example: application/json
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
    noauthAuth:
      type: http
      scheme: noauth
