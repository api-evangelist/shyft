    post:
      tags:
      - Customer > Posts
      summary: create a post
      description: "Description\n- - - \n- Create a regular channel post\n- Create a free post\n- Create a announcement post by admin\n- Attach a picture along with post\n\n\nParams\n- - -\nParam | Values | R |Description\n--- | --- | --- | ---\n\n\nHeaders\n- - -\nHeader | Values | R |Description\n--- | --- | --- | ---\n\n\n\nInput\n- - - \n\nAttribute | Values | R |Description\n--- | --- | --- | ---\nchannel_id | integer | * | target channel's ID\ntitle | string | * | post title\ncontent | string | * | post content\nattached_files_blob_ids | array of integer |  | attached file IDs\npost_type | integer | * | for announcement, the value is `1`, only avaialble for admin users\n\nInput Sub attachment_attributes[object_instances]\n- - -\n\nAttribute | Values | R |Description\n--- | --- | --- | ---\nimage_name | string | * | value is `post_image`\nclass_name | string | * | value is `class_name`\nid | integer | * | the image ID generated from previous image uploading API"
      requestBody:
        content:
          '*/*':
            schema:
              type: string
              example: '"{\n  \"post\": {\n  \t\"channel_id\": 3344,\n    \"title\": \"PDF Sample\",\n    \"content\": \"This is a sample PDF file\",\n    \"attached_files_blob_ids\": [10]\n  }\n}\t"'
      parameters:
      - name: Session-Uukey
        in: header
        schema:
          type: string
        example: '{{session_uukey}}'
      - name: Content-Type
        in: header
        schema:
          type: string
        example: application/json
      responses:
        '201':
          description: Created
          headers:
            Server:
              schema:
                type: string
                example: nginx/1.19.3
            Date:
              schema:
                type: string
                example: Mon, 28 Dec 2020 22:10:43 GMT
            Content-Type:
              schema:
                type: string
                example: application/json; charset=utf-8
            Transfer-Encoding:
              schema:
                type: string
                example: chunked
            Connection:
              schema:
                type: string
                example: keep-alive
            X-Frame-Options:
              schema:
                type: string
                example: SAMEORIGIN
            X-XSS-Protection:
              schema:
                type: string
                example: 1; mode=block
            X-Content-Type-Options:
              schema:
                type: string
                example: nosniff
            X-Download-Options:
              schema:
                type: string
                example: noopen
            X-Permitted-Cross-Domain-Policies:
              schema:
                type: string
                example: none
            Referrer-Policy:
              schema:
                type: string
                example: strict-origin-when-cross-origin
            X-LS-License:
              schema:
                type: string
                example: All Rights Reserved Â© Coffee Enterprise
            X-LS-Application:
              schema:
                type: string
                example: Coffee Mobile
            X-Request-Method:
              schema:
                type: string
                example: none
            ETag:
              schema:
                type: string
                example: W/"daca30cd2a70dd9f0eeb08a293e7274c"
            Cache-Control:
              schema:
                type: string
                example: max-age=0, private, must-revalidate
