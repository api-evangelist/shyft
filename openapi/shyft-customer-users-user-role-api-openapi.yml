  /api/customer/user_role/users/{user_id}:
    get:
      tags:
      - Customer > Users > user_role
      summary: '[users] Get user profile'
      description: "Input \n- - -\n\nAttribute | Values | M\n--- | --- | ---\n\nOutput \n- - -\n\n\npush settings list: \n- label is translated\n- type indicate the value server can accept\n- `key` is the attribute name\n\n```\n        \"push_settings_list\": {\n            \"all_push\": {\n                \"label\": \"All Push Notifications\",\n                \"type\": \"boolean\"\n            },\n            \"shift_push\": {\n                \"label\": \"Shift Notifications\",\n                \"type\": \"boolean\"\n            },\n            \"schedule_push\": {\n                \"label\": \"Schedule Notifications\",\n                \"type\": \"boolean\"\n            },\n            \"community_push\": {\n                \"label\": \"Community Notifications\",\n                \"type\": \"boolean\"\n            }\n        }\n```       \n        \n\nAttribute | Values |\n--- | ---"
      parameters:
      - name: Session-Uukey
        in: header
        schema:
          type: string
        example: '{{session_uukey}}'
      - name: Content-Type
        in: header
        schema:
          type: string
        example: application/json
      - name: user_id
        in: path
        schema:
          type: string
        required: true
      responses:
        '200':
          description: OK
          headers:
            X-Frame-Options:
              schema:
                type: string
                example: SAMEORIGIN
            X-XSS-Protection:
              schema:
                type: string
                example: 1; mode=block
            X-Content-Type-Options:
              schema:
                type: string
                example: nosniff
            X-LS-License:
              schema:
                type: string
                example: All Rights Reserved Â© Coffee Enterprise
            X-LS-Application:
              schema:
                type: string
                example: Coffee Mobile
            X-Request-Method:
              schema:
                type: string
                example: none
            Content-Type:
              schema:
                type: string
                example: application/json; charset=utf-8
            ETag:
