openapi: 3.2.0
info:
  title: Shyft Customer Support API
  description: Welcome to the Shyft Customer App API.
  version: 1.0.0
servers:
- url: http://{{host}}
- url: http://{{local-host}}
- url: http://{{sp3-host}}
- url: http://test-service.myshyft.com
- url: http://localhost:4001
- url: http://localhost:3000
- url: http://{{local-host}}api
- url: https://test-unfurl.myshyft.com
tags:
- name: Support
paths:
  /:
    get:
      tags:
      - Support
      summary: Unfurl URL
      parameters:
      - name: url
        in: query
        schema:
          type: string
        example: https://google.com
      responses:
        '200':
          description: OK
          headers:
            Server:
              schema:
                type: string
                example: nginx/1.17.0
            Date:
              schema:
                type: string
                example: Tue, 13 Sep 2022 00:04:06 GMT
            Content-Type:
              schema:
                type: string
                example: application/json; charset=utf-8
            Transfer-Encoding:
              schema:
                type: string
                example: chunked
            Connection:
              schema:
                type: string
                example: keep-alive
            Access-Control-Allow-Origin:
              schema:
                type: string
                example: '*'
            Access-Control-Allow-Methods:
              schema:
                type: string
                example: GET, PUT, POST, DELETE, OPTIONS
            Access-Control-Allow-Headers:
              schema:
                type: string
                example: Content-Type, Access-Control-Allow-Headers, Authorization, X-Requested-With
            Content-Encoding:
              schema:
                type: string
                example: gzip
          content:
            application/json:
              schema:
                type: object
              example:
                author: null
                date: null
                description: Search the world’s information, including webpages, images, videos and more. Google has many special features to help you find exactly what you’re looking for.
                image: https://www.google.com/images/branding/googleg/1x/googleg_standard_color_128dp.png
                logo: https://logo.clearbit.com/google.com
                publisher: Google
                title: Google
                url: https://www.google.com/
      operationId: getRoot
      x-operation-id-source: derived
  /api/stripe/create-portal-session:
    post:
      tags:
      - Support
      summary: Stripe session
      description: 'Input

        - - -


        Attribute | Values | M

        --- | --- | ---

        email | your email using for admin claim | Y

        ref_id | target location ID | Y

        email_host | the host of the hyberlink inside the email |


        Output

        - - -


        Attribute | Values |

        --- | ---

        id | recrod ID

        sent_to | sent_to_shyft|sent_to_user'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                customerId: cus_SE7ctRXkkDpdbb
                returnUrl: https://sp3-manager.myshyft.com/settings/subscription
                response:
                  put_return_resource: 'true'
                  nested: '2'
      parameters:
      - name: Content-Type
        in: header
        schema:
          type: string
        example: application/json
      - name: Session-Uukey
        in: header
        schema:
          type: string
        description: '[MESSION] session token UUID. replace `session-token`

          '
        example: '{{session_uukey}}'
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
      operationId: postApiStripeCreatePortalSession
      x-operation-id-source: derived
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
    noauthAuth:
      type: http
      scheme: noauth
