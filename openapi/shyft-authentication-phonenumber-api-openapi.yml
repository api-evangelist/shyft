  /api/users/sign_in:
    post:
      tags:
      - Authentication > PhoneNumber
      summary: PhoneNumber - Sign in/Confirm
      description: "Description\n- - - \n- Sign in user with SMS code\n- Get `Session-Token` or `Session-Uukey` from response headers, and use for further API calls. \n\n\nParams\n- - -\nParam | Values | R |Description\n--- | --- | --- | ---\n\n\nHeaders\n- - -\nHeader | Values | R |Description\n--- | --- | --- | ---\n\nInput\n- - - \n\nAttribute | Values | R |Description\n--- | --- | --- | ---\nphone_number |  | * | |\nsign_in_code |   |* | |"
      requestBody:
        content:
          '*/*':
            schema:
              type: string
              example: '"{\n  \"api_user\": {\n    \"phone_number\": \"18883836001\",\n    \"sign_in_code\": \"9999\"\n  }\n}   "'
      parameters:
      - name: Content-Type
        in: header
        schema:
          type: string
        example: application/json
      - name: location_id
        in: query
        schema:
          type: integer
        example: '7'
      responses:
        '201':
          description: Created
          headers:
            X-Frame-Options:
              schema:
                type: string
                example: SAMEORIGIN
            X-XSS-Protection:
              schema:
                type: string
                example: 1; mode=block
            X-Content-Type-Options:
              schema:
                type: string
                example: nosniff
            Location:
              schema:
                type: string
                example: /
            Content-Type:
              schema:
                type: string
                example: application/json; charset=utf-8
            Session-Token:
              schema:
                type: integer
                example: '25764'
            Session-Uukey:
              schema:
                type: string
                example: 0ced24c0-cc32-418e-900e-1dea26e3c1cc
            access-token:
              schema:
                type: string
                example: dkEq2JQs5w0LXPPhGZUwhg
            token-type:
              schema:
                type: string
                example: Bearer
            client:
              schema:
                type: string
                example: bKC-6_hbF10ejlamKnDPkw
            expiry:
              schema:
                type: integer
                example: '1572547879'
            uid:
              schema:
                type: integer
                example: '18883836001'
            Phone-Number:
              schema:
                type: integer
                example: '18883836001'
            Auth-Category:
              schema:
                type: string
                example: phone_number
            Auth-Target:
              schema:
                type: integer
                example: '18883836001'
            Authorization:
              schema:
                type: string
                example: Bearer eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiI5NjI1Iiwic2NwIjoiYXBpX3VzZXIiLCJhdWQiOm51bGwsImlhdCI6MTU0MTA5ODI3OSwiZXhwIjoxNTQxMTAxODc5LCJqdGkiOiIwMmFmYTRhMS05ZGJiLTQwMGQtYTc2MS1iNjRiMGRiZDJkODMifQ.l9sRtAAVmgJj03F9IzzEXtHo8K8UGYRWh27fdhJ1oCQ
            ETag:
              schema:
                type: string
                example: W/"9a7a5b72b492fe1b4e13268da2aaf631"
            Cache-Control:
              schema:
                type: string
                example: max-age=0, private, must-revalidate
            Set-Cookie:
              schema:
                type: string
                example: _shyft_api_server_session=N1BRTEY2dlNuTGZoVzZnVHNuSS9BQVVvRytEeld1WUQxN2hOVnFpcHVsWUwveExNU0ozU2hhOFBrTmttei80T1gvMUt6aWtONzNJblIreFNSY0NCZ2c9PS0tT0dVQ2dOZy9IWmNQZEczNDBoQk1PUT09--6123dd08017535690c0617f94304699c55d26c28; path=/; HttpOnly
            X-Rack-Dev-Mark-Env:
              schema:
                type: string
                example: Bin%27s+Local+Server
            X-Request-Id:
              schema:
                type: string
                example: 3a9b263b-6772-474e-8a9d-bbc97b85798c
            X-Runtime:
              schema:
                type: number
                example: '0.448973'
            Vary:
              schema:
                type: string
                example: Origin
            Connection:
              schema:
                type: string
                example: close
            Server:
              schema:
                type: string
                example: thin 1.5.1 codename Straight Razor
          content:
            application/json:
              schema:
                type: object
              example:
                user:
                  _parent_object_id: null
                  id: 9625
                  active_org: 0
                  first_name: John
                  last_name: Doe
                  email: null
                  phone_number: '18883836001'
                  gender: 0
                  chat_handle: 911bf630a47c543b70303b3a42400f14
                  user_group: 0
                  status: ''
                  profile_image: null
                  recent_user_privilege: null
  /api/code_auth/18885555555:
    get:
      tags:
      - Authentication > PhoneNumber
      summary: PhoneNumber - Get SMS Code
      description: "Description\n- - - \n- Resend confirmation code if user did not get previous one\n\n\nParams\n- - -\nParam | Values | R |Description\n--- | --- | --- | ---\nconfirm| true | * | Must set it be true\n\nHeaders\n- - -\nHeader | Values | R |Description\n--- | --- | --- | ---\n\n\nInput\n- - - \n\nAttribute | Values | R |Description\n--- | --- | --- | ---\nunconfirmed_phone_number |  | * | |\nsign_in_code |   |* | |"
      parameters:
      - name: Content-Type
        in: header
        schema:
          type: string
        example: application/json
      - name: confirm
        in: query
        schema:
          type: boolean
        description: 'when first time login, target on unconfirmed account

          '
        example: 'true'
      responses:
        '200':
          description: OK
          headers:
            X-Frame-Options:
              schema:
                type: string
                example: SAMEORIGIN
            X-XSS-Protection:
              schema:
                type: string
                example: 1; mode=block
            X-Content-Type-Options:
              schema:
                type: string
                example: nosniff
            X-Download-Options:
              schema:
                type: string
                example: noopen
            X-Permitted-Cross-Domain-Policies:
              schema:
                type: string
                example: none
            Referrer-Policy:
              schema:
                type: string
                example: strict-origin-when-cross-origin
            Content-Type:
              schema:
                type: string
                example: application/json
            Cache-Control:
              schema:
                type: string
                example: no-cache
            X-Request-Id:
              schema:
                type: string
                example: 578b6f22-0418-42e8-ad45-23dfbc607251
            X-Runtime:
              schema:
                type: number
                example: '0.124879'
            Vary:
              schema:
                type: string
                example: Origin
            Transfer-Encoding:
              schema:
                type: string
                example: chunked
            Content-Encoding:
              schema:
                type: string
                example: gzip
            Strict-Transport-Security:
              schema:
                type: string
                example: max-age=31536000;
          content:
            application/json:
              schema:
                type: object
              example: {}
  /api/users/super_login:
    get:
      tags:
      - Authentication > PhoneNumber
      summary: PhoneNumber - SuperLogin
      description: "Description\n- - - \n- Login as a God build\n- Get `Session-Token` or `Session-Uukey` from response headers, and use for further API calls. \n\n\nParams\n- - -\nParam | Values | R |Description\n--- | --- | --- | ---\nlogin |  | * | | phone_number or email\n\nHeaders\n- - -\nHeader | Values | R |Description\n--- | --- | --- | ---\nGod-Key | | * | |\n\nInput\n- - - \n\nAttribute | Values | R |Description\n--- | --- | --- | ---"
      parameters:
      - name: Content-Type
        in: header
        schema:
          type: string
        example: application/json
      - name: God-Key
        in: header
        schema:
          type: string
        example: '{{god_key}}'
      - name: login
        in: query
        schema:
          type: integer
        example: '18883836001'
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
    noauthAuth:
      type: http
      scheme: noauth
