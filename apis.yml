name: Shyft
description: >-
  Shyft is a mobile-first workforce management platform for hourly and shift-based
  teams — employees swap shifts, message teammates, set their availability, and manage
  schedules from their phone, while managers build and publish schedules from a
  dashboard. The Shyft Customer API is the REST/JSON backend behind the Shyft iOS and
  Android apps, the web app, and the Manager Dashboard, covering authentication, users,
  locations, availabilities, schedules and shifts, channels and chats, posts and
  notifications, departments, subscriptions, and earned wage access (EWA). It is
  secured with HTTP Bearer (JWT) tokens. Shyft is backed by General Catalyst and Techstars.
